name: CI and JOSS Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Test Suite with Pytest & Coverage
        run: |
          pytest --cov=sgl_sim --cov-report=term-missing --cov-report=xml tests/

  joss-paper:
    name: Build JOSS Paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile JOSS Paper with Inara
        uses: xuanxu/paper-action@v1
        with:
          paper_path: paper/paper.md
        continue-on-error: true

      - name: Upload Paper Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: paper/*.pdf
