[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-sim"
version = "0.1.0"
description = "Gravitational Lens Telescopes (Solar & Black Hole Focal Line Missions) Simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SGL Mission Design Team", email = "research@sgl-sim.org" }
]
keywords = [
    "astrophysics",
    "gravitational-lensing",
    "solar-gravitational-lens",
    "black-hole",
    "mission-design",
    "optics",
    "exoplanet-imaging",
    "astropy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "astropy>=5.0.0",
    "flask>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sgl-sim-server = "sgl_sim.web.app:run_server"

[project.urls]
Homepage = "https://github.com/teom275/sgl-sim"
Documentation = "https://github.com/teom275/sgl-sim#readme"
Repository = "https://github.com/teom275/sgl-sim.git"
"Bug Tracker" = "https://github.com/teom275/sgl-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
