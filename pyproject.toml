[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-sim"
version = "0.1.0"
description = "Gravitational Lens Telescopes (Solar & Black Hole Focal Line Missions) Simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Teo Maggio" }
]
keywords = [
    "astrophysics",
    "gravitational-lensing",
    "solar-gravitational-lens",
    "black-hole",
    "mission-design",
    "optics",
    "exoplanet-imaging",
    "astropy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "astropy>=5.0.0",
    "flask>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# Production web server for the hosted dashboard (see render.yaml).
server = [
    "gunicorn>=21.2",
]
# Interactive 3Blue1Brown-style scenes (src/sgl_sim/manim_scenes). ManimGL 1.7.x
# still imports pkg_resources and pydub (audioop), hence the two shims.
manim = [
    "manimgl>=1.7.2",
    "setuptools<81",
    "audioop-lts; python_version >= '3.13'",
]

[project.scripts]
sgl-sim-server = "sgl_sim.web.app:run_server"

[project.urls]
Homepage = "https://github.com/teom275/sgl-sim"
Documentation = "https://github.com/teom275/sgl-sim#readme"
Repository = "https://github.com/teom275/sgl-sim.git"
"Bug Tracker" = "https://github.com/teom275/sgl-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the dashboard's HTML/CSS/JS with the package; without this a regular
# (non-editable) install, such as the Render deployment, has no templates.
"sgl_sim.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
# The ManimGL scene file needs an OpenGL context; its physics lives in
# manim_scenes/model.py, which is fully covered by tests/test_manim_model.py.
omit = ["*/sgl_sim/manim_scenes/sgl_interactive.py"]
